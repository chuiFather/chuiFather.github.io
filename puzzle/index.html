<p><img src="icon.png" alt="" width="96" height="96" style="border-radius:22px"></p><h1>츄이의 퍼즐놀이</h1><p>밀고, 맞추고, 잇고, 합치고, 놓고! 강아지·고양이 친구들과 퍼즐 다섯 가지</p><p><img src="feature.png" alt="" style="width:100%;border-radius:12px"></p><ul><li>친구 모으기: 밀어서 같은 친구를 합쳐 츄이까지</li><li>퍼즐 공원: 장난감 3개 맞춰 보스 물리치기 (40스테이지)</li><li>이어 합치기: 친구를 이어 그어 한 번에 합치기 (40스테이지)</li><li>간식 가게: 간식을 합쳐 손님 주문 채우기</li><li>친구 블록: 블록을 놓아 줄 지우기, 연달아 지우면 콤보</li><li>오늘의 도전: 모두 같은 판, 날마다 모드가 바뀌어요</li></ul><p><a href="privacy/">개인정보처리방침</a> · <a href="../">츄이 시리즈 홈</a></p>
